[project]
name = "emporio-agent"
version = "0.1.0"
description = "Customer-service agent prototype for Empório da Música, a fictional musical instrument store"
readme = "README.md"
authors = [
    { name = "Alan Giglio", email = "37912190+GiglioAlan@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.8",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
]

[project.scripts]
emporio-agent = "emporio_agent:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# third-party noise (langsmith uses an API deprecated in Python 3.14)
filterwarnings = ["ignore::DeprecationWarning:langsmith.*"]
